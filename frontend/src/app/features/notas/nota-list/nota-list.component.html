<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
  <h2>Notas Fiscais</h2>
  <button mat-raised-button color="primary" routerLink="/notas/nova"><mat-icon>add</mat-icon> Nova Nota Fiscal</button>
</div>

@if (carregando) {
  <mat-spinner diameter="32" />
}

@if (erro) {
  <p style="color:#b00020">{{ erro }}</p>
  <button mat-stroked-button (click)="carregar()">Tentar novamente</button>
}

@if (!carregando && !erro) {
  @if (notas.length === 0) {
    <p>Nenhuma nota fiscal cadastrada ainda.</p>
  } @else {
    <table mat-table [dataSource]="notas" style="width:100%">
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>Número</th>
        <td mat-cell *matCellDef="let n">{{ n.numero }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let n">
          <mat-chip [color]="n.status === 'ABERTA' ? 'accent' : 'primary'" selected>{{ n.status }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="itens">
        <th mat-header-cell *matHeaderCellDef>Itens</th>
        <td mat-cell *matCellDef="let n">{{ n.itens.length }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let n">
          <a mat-button color="primary" [routerLink]="['/notas', n.numero]">Visualizar</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>
  }
}
