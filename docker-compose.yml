services:
  db_estoque:
    image: postgres:15-alpine
    container_name: db_estoque
    environment:
      POSTGRES_USER: ${ESTOQUE_DB_USER}
      POSTGRES_PASSWORD: ${ESTOQUE_DB_PASSWORD}
      POSTGRES_DB: ${ESTOQUE_DB_NAME}
    ports:
      - "${ESTOQUE_DB_PORT}:5432"
    volumes:
      - estoque_data:/var/lib/postgresql/data
    restart: unless-stopped

  db_faturamento:
    image: postgres:15-alpine
    container_name: db_faturamento
    environment:
      POSTGRES_USER: ${FATURAMENTO_DB_USER}
      POSTGRES_PASSWORD: ${FATURAMENTO_DB_PASSWORD}
      POSTGRES_DB: ${FATURAMENTO_DB_NAME}
    ports:
      - "${FATURAMENTO_DB_PORT}:5432"
    volumes:
      - faturamento_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  estoque_data:
  faturamento_data: